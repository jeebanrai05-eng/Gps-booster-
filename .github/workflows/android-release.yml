name: Android Build, Test & Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Build signed release APK and publish GitHub Release?'
        required: false
        default: false
        type: boolean
      release_tag:
        description: 'Release tag name (only used when create_release is true, e.g. v1.01)'
        required: false
        default: 'v1.01'
        type: string

permissions:
  contents: write

jobs:
  ci_build:
    name: Test, Lint & Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure preinstalled Android SDK
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_DIR" ]; then
            echo "::error::Android SDK directory not found at $SDK_DIR"
            exit 1
          fi

          if [ -x "${SDK_DIR}/cmdline-tools/latest/bin/sdkmanager" ]; then
            CMDLINE_BIN_DIR="${SDK_DIR}/cmdline-tools/latest/bin"
          else
            FALLBACK_SDKMANAGER=$(find "${SDK_DIR}/cmdline-tools" -maxdepth 2 -name "sdkmanager" -type f 2>/dev/null | head -n1 || true)
            if [ -z "$FALLBACK_SDKMANAGER" ]; then
              echo "::error::Preinstalled sdkmanager not found under ${SDK_DIR}/cmdline-tools"
              exit 1
            fi
            CMDLINE_BIN_DIR="$(dirname "$FALLBACK_SDKMANAGER")"
          fi

          echo "ANDROID_HOME=${SDK_DIR}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK_DIR}" >> "$GITHUB_ENV"
          echo "${CMDLINE_BIN_DIR}" >> "$GITHUB_PATH"
          echo "${SDK_DIR}/platform-tools" >> "$GITHUB_PATH"

      - name: Verify sdkmanager, accept licenses & install required SDK packages
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"
          sdkmanager --version

          set +o pipefail
          yes | sdkmanager --licenses > /dev/null
          set -o pipefail

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "platforms;android-36.1" \
            "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ensure Gradle wrapper and debug keystore exist for CI
        run: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 9.3.1
          fi
          chmod +x ./gradlew

          if [ ! -f "debug.keystore" ]; then
            if [ -f "debug.keystore.base64" ]; then
              base64 --decode debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v -keystore debug.keystore \
                -storepass android -alias androiddebugkey -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Run unit and Robolectric tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace --console=plain

      - name: Run Android lint checks
        run: ./gradlew lintDebug --no-daemon --console=plain

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --console=plain

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ultimate-Rider-Booster-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release_apk:
    name: Sign & Publish Release APK
    needs: ci_build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure preinstalled Android SDK
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_DIR" ]; then
            echo "::error::Android SDK directory not found at $SDK_DIR"
            exit 1
          fi

          if [ -x "${SDK_DIR}/cmdline-tools/latest/bin/sdkmanager" ]; then
            CMDLINE_BIN_DIR="${SDK_DIR}/cmdline-tools/latest/bin"
          else
            FALLBACK_SDKMANAGER=$(find "${SDK_DIR}/cmdline-tools" -maxdepth 2 -name "sdkmanager" -type f 2>/dev/null | head -n1 || true)
            if [ -z "$FALLBACK_SDKMANAGER" ]; then
              echo "::error::Preinstalled sdkmanager not found under ${SDK_DIR}/cmdline-tools"
              exit 1
            fi
            CMDLINE_BIN_DIR="$(dirname "$FALLBACK_SDKMANAGER")"
          fi

          echo "ANDROID_HOME=${SDK_DIR}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK_DIR}" >> "$GITHUB_ENV"
          echo "${CMDLINE_BIN_DIR}" >> "$GITHUB_PATH"
          echo "${SDK_DIR}/platform-tools" >> "$GITHUB_PATH"

      - name: Verify sdkmanager, accept licenses & install required SDK packages
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"
          sdkmanager --version

          set +o pipefail
          yes | sdkmanager --licenses > /dev/null
          set -o pipefail

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "platforms;android-36.1" \
            "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ensure Gradle wrapper exists for CI
        run: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 9.3.1
          fi
          chmod +x ./gradlew

      - name: Validate signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS_VAL: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASS" ] || [ -z "$KEY_ALIAS_VAL" ] || [ -z "$KEY_PASS" ]; then
            echo "::error::Missing required GitHub Actions signing secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD."
            exit 1
          fi

      - name: Decode production keystore securely
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > "${{ runner.temp }}/release-keystore.jks"
          if [ ! -s "${{ runner.temp }}/release-keystore.jks" ]; then
            echo "::error::Decoded keystore file is empty."
            exit 1
          fi

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release-keystore.jks
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --console=plain

      - name: Prepare release artifact and SHA-256 checksum
        id: metadata
        run: |
          APK_SOURCE="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_SOURCE" ]; then
            echo "::error::Signed release APK not found at $APK_SOURCE"
            exit 1
          fi

          mkdir -p release_assets
          APK_OUT="release_assets/Ultimate-Rider-Booster.apk"
          cp "$APK_SOURCE" "$APK_OUT"

          APK_SHA256=$(sha256sum "$APK_OUT" | awk '{print $1}')
          APK_SIZE=$(stat -c%s "$APK_OUT")

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
          else
            TAG_NAME="${{ inputs.release_tag }}"
          fi
          VERSION_NAME="${TAG_NAME#v}"

          VERSION_CODE=$(grep -E "versionCode\s*=" app/build.gradle.kts | head -n1 | grep -oE "[0-9]+")
          if [ -z "$VERSION_CODE" ]; then
            echo "::error::Failed to extract versionCode from app/build.gradle.kts"
            exit 1
          fi

          PREV_VERSION_CODE=0
          if [ -f "version.json" ]; then
            PREV_VERSION_CODE=$(python3 -c "import json; d=json.load(open('version.json')); print(int(d.get('versionCode', 0)))" 2>/dev/null || echo 0)
          fi

          if [ "$VERSION_CODE" -lt "$PREV_VERSION_CODE" ]; then
            echo "::error::versionCode ($VERSION_CODE) must not decrease below published versionCode ($PREV_VERSION_CODE)."
            exit 1
          fi

          OWNER=$(echo "${{ github.repository }}" | cut -d'/' -f1)
          REPO=$(echo "${{ github.repository }}" | cut -d'/' -f2)
          APK_URL="https://github.com/${OWNER}/${REPO}/releases/download/${TAG_NAME}/Ultimate-Rider-Booster.apk"
          RELEASE_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          python3 - <<EOF
          import json
          manifest = {
              "versionCode": int("${VERSION_CODE}"),
              "versionName": "${VERSION_NAME}",
              "releaseTitle": f"Ultimate Rider Booster ${TAG_NAME}",
              "releaseNotes": "Verified signed APK release with Smart GPS Recovery, Talabat Rider detection, and Background Rider Mode.",
              "apkUrl": "${APK_URL}",
              "sha256": "${APK_SHA256}",
              "mandatory": False,
              "minSupportedVersionCode": 1,
              "apkSizeBytes": int("${APK_SIZE}"),
              "releaseDate": "${RELEASE_DATE}"
          }
          with open("version.json", "w") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")
          EOF

          echo "tag=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "sha256=${APK_SHA256}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"

      - name: Remove temporary keystore
        if: always()
        run: rm -f "${{ runner.temp }}/release-keystore.jks"

      - name: Create GitHub Release and upload signed APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.metadata.outputs.tag }}
          name: "Ultimate Rider Booster ${{ steps.metadata.outputs.tag }}"
          body: |
            Signed release APK for Ultimate Rider Booster `${{ steps.metadata.outputs.version_name }}` (versionCode `${{ steps.metadata.outputs.version_code }}`).
            SHA-256: `${{ steps.metadata.outputs.sha256 }}`
          files: |
            release_assets/Ultimate-Rider-Booster.apk

      - name: Commit and publish updated version.json to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -- gradle/wrapper/gradle-wrapper.properties || true
          rm -f gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar
          git fetch origin main || true
          git checkout -B main origin/main || git checkout -B main
          git add version.json
          if git diff --cached --quiet; then
            echo "version.json unchanged; skipping commit."
          else
            git commit -m "chore(release): publish version.json for ${{ steps.metadata.outputs.tag }} [skip ci]"
            git push origin main
          fi
